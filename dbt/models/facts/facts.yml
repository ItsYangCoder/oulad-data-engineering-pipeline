version: 2

models:
  - name: fact_student_enrollment
    description: One row per student enrollment in one module presentation.
    columns:
      - name: enrollment_key
        data_tests: [not_null, unique]
      - name: student_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_student')", field: student_key}
      - name: course_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_course')", field: course_key}
      - name: presentation_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_module_presentation')", field: presentation_key}
      - name: demographics_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_demographics')", field: demographics_key}
      - name: registration_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: unregistration_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: id_student
        data_tests: [not_null]
      - name: code_module
        data_tests: [not_null]
      - name: code_presentation
        data_tests: [not_null]
      - name: final_result
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Distinction', 'Pass', 'Fail', 'Withdrawn']}
      - name: is_withdrawn
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [true, false], quote: false}
      - name: assessment_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: scored_assessment_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: missing_score_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: average_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100, inclusive: true}

  - name: fact_vle_interactions
    description: One row per student, module presentation, VLE resource and relative day.
    columns:
      - name: vle_interaction_key
        data_tests: [not_null, unique]
      - name: student_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_student')", field: student_key}
      - name: course_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_course')", field: course_key}
      - name: presentation_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_module_presentation')", field: presentation_key}
      - name: demographics_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_demographics')", field: demographics_key}
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: code_module
        data_tests: [not_null]
      - name: code_presentation
        data_tests: [not_null]
      - name: id_student
        data_tests: [not_null]
      - name: id_site
        data_tests: [not_null]
      - name: relative_day
        data_tests: [not_null]
      - name: mart_load_timestamp
        data_tests: [not_null]
      - name: mart_load_date
        data_tests: [not_null]
      - name: sum_click
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
