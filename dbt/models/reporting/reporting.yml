version: 2

models:
  - name: vw_student_outcomes
    description: Enrollment-level reporting view with assessment and VLE summaries.
    columns:
      - name: enrollment_key
        data_tests: [not_null, unique]
      - name: id_student
        data_tests: [not_null]
      - name: code_module
        data_tests: [not_null]
      - name: code_presentation
        data_tests: [not_null]
      - name: final_result
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Distinction', 'Pass', 'Fail', 'Withdrawn']}
      - name: total_clicks
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: active_days
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
