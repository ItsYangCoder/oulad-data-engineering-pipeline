version: 2

sources:
  - name: oulad_silver
    description: Clean OULAD tables produced by the Silver layer.
    database: open_university
    schema: oulad_silver
    tables:
      - name: assessment_clean
        description: One cleaned record per assessment.
        columns:
          - name: id_assessment
            data_tests:
              - not_null
              - unique
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: courses_clean
        description: One cleaned record per module presentation.
        columns:
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: module_presentation_length
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: student_assessment_clean
        description: One cleaned student result per assessment.
        columns:
          - name: id_assessment
            data_tests:
              - not_null
          - name: id_student
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: student_info_clean
        description: One cleaned student enrollment per module presentation.
        columns:
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: id_student
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: student_registration_clean
        description: Registration dates for each student enrollment.
        columns:
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: id_student
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: student_vle_clean
        description: Daily clicks per student, module presentation, and VLE resource.
        columns:
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: id_student
            data_tests:
              - not_null
          - name: id_site
            data_tests:
              - not_null
          - name: date
            data_tests:
              - not_null
          - name: sum_click
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null

      - name: vle_clean
        description: One cleaned VLE resource per module presentation.
        columns:
          - name: code_module
            data_tests:
              - not_null
          - name: code_presentation
            data_tests:
              - not_null
          - name: id_site
            data_tests:
              - not_null
          - name: clean_load_timestamp
            data_tests:
              - not_null
