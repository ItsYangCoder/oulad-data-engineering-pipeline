version: 2

models:
  - name: vw_student_outcomes
    description: "One row per student enrollment in a module presentation. Assessment and VLE activity are aggregated separately before joining."
    tests:
      - unique:
          column_name: "concat(code_module, '||', code_presentation, '||', cast(id_student as string))"
      - not_null:
          column_name: code_module
      - not_null:
          column_name: code_presentation
      - not_null:
          column_name: id_student
    columns:
      - name: final_result
        tests:
          - accepted_values:
              values: ['Distinction', 'Pass', 'Fail', 'Withdrawn']
      - name: is_withdrawn
        tests:
          - not_null
      - name: result_count
        tests:
          - not_null
      - name: total_clicks
        tests:
          - not_null
