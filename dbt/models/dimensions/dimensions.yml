version: 2

models:
  - name: dim_student
    description: One row per student.
    columns:
      - name: student_key
        data_tests: [not_null, unique]
      - name: id_student
        data_tests: [not_null, unique]

  - name: dim_course
    description: One row per module.
    columns:
      - name: course_key
        data_tests: [not_null, unique]
      - name: code_module
        data_tests: [not_null, unique]

  - name: dim_module_presentation
    description: One row per code_module and code_presentation combination.
    columns:
      - name: presentation_key
        data_tests: [not_null, unique]
      - name: code_module
        data_tests: [not_null]
      - name: code_presentation
        data_tests: [not_null]
      - name: module_presentation_length
        data_tests: [not_null]

  - name: dim_date
    description: One row per relative day plus one Unknown row for missing dates.
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: relative_day
        description: Relative day; NULL only for the Unknown row.
      - name: timing_group
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Pre-Presentation', 'Presentation Period', 'Unknown']}

  - name: dim_demographics
    description: One row per distinct null-safe demographic profile.
    columns:
      - name: demographics_key
        data_tests: [not_null, unique]
      - name: imd_band
        description: Nullable because the source contains unknown IMD bands.
