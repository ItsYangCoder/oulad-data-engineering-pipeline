name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-project:
    name: SQL, YAML and dbt checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # These values only let dbt read the profile during parsing.
      # This job does not connect to Databricks or change any tables.
      DATABRICKS_HOST: https://ci-parse-only.invalid
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci-parse-only
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ci-parse-only
      DBT_SCHEMA: oulad_gold_ci

    steps:
      - name: Get the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan every committed file for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block destructive data statements
        run: |
          if grep -RInE --include="*.sql"             "^[[:space:]]*(WHEN[[:space:]]+NOT[[:space:]]+MATCHED[[:space:]]+BY[[:space:]]+SOURCE[[:space:]]+THEN[[:space:]]+DELETE|INSERT[[:space:]]+OVERWRITE|DELETE[[:space:]]+FROM|TRUNCATE[[:space:]]+TABLE|DROP[[:space:]]+TABLE|CREATE[[:space:]]+OR[[:space:]]+REPLACE[[:space:]]+TABLE)"             src/sql dbt/models; then
            echo "Destructive SQL is blocked. Use a reviewed non-destructive MERGE or explicit delete-event design."
            exit 1
          fi

      - name: Require active dbt data tests
        run: |
          if grep -RInF "{{ config(enabled=false) }}" dbt/tests; then
            echo "A disabled dbt data test was found. CI cannot treat placeholder tests as coverage."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install pinned validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dbt/requirements.txt
          python -m pip install yamllint==1.37.1 sqlfluff==3.4.2

      - name: Validate YAML syntax
        run: |
          find . -type f \( -name "*.yml" -o -name "*.yaml" \)             -not -path "./dbt/target/*"             -not -path "./dbt/dbt_packages/*"             -print0 |
          while IFS= read -r -d "" file; do
            echo "Checking ${file}"
            yamllint -d "{extends: relaxed, rules: {line-length: disable, new-line-at-end-of-file: disable}}" "${file}"
          done

      - name: Prove invalid YAML is rejected
        run: |
          invalid_file="${RUNNER_TEMP}/known-invalid.yml"
          printf 'project:\n  name: oulad\n broken\n' > "${invalid_file}"

          if yamllint -d relaxed "${invalid_file}"; then
            echo "The YAML checker accepted a known invalid file."
            exit 1
          fi

          echo "PASS: the YAML checker rejected the known invalid file."

      - name: Validate Databricks SQL syntax
        run: |
          find src/sql tests -type f -name "*.sql" -print0 |
          while IFS= read -r -d "" file; do
            echo "Checking ${file}"
            temp_file="$(mktemp --suffix=.sql)"

            # SQLFluff does not parse this valid Databricks DROP VIEW statement yet.
            # Remove only that exact statement from the temporary copy.
            sed '/^[[:space:]]*DROP VIEW IF EXISTS [A-Za-z0-9_.]*;[[:space:]]*$/d' "${file}" > "${temp_file}"
            if ! sqlfluff parse --dialect databricks --templater jinja --ignore templating "${temp_file}" > "${RUNNER_TEMP}/sqlfluff-output.txt"; then
              cat "${RUNNER_TEMP}/sqlfluff-output.txt"
              exit 1
            fi

            rm "${temp_file}"
          done

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: Parse the dbt project
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt parse --profiles-dir . --target dev
